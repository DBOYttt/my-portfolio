# Nginx config for Cloudflare Tunnel deployment — HTTP internally, HTTPS externally.
# cloudflared → nginx connection is plain HTTP; Cloudflare handles TLS termination.
# X-Forwarded-Proto is hardcoded to "https" — $scheme would always be "http" here,
# which would break Auth.js Secure cookie flags and the __Secure- cookie prefix.

server {
    listen 80;
    # CUSTOMIZE: Replace yourdomain.com with your Cloudflare-managed domain.
    server_name yourdomain.com www.yourdomain.com;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CUSTOMIZE: Replace the frame-src domain with your Autodesk 360 embed domain
    # (found in the embed URL under Settings > Share > Embed in Fusion 360).
    # Remove the frame-src directive entirely if you are not using the Robotics section embed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src https://gmail3794190.autodesk360.com; frame-ancestors 'none'" always;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto "https";
        proxy_cache_bypass $http_upgrade;
    }
}
