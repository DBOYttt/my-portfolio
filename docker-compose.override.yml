# Production override — Cloudflare Tunnel deployment.
# Nginx listens on port 80; cloudflared connects to http://localhost:80.
# Cloudflare handles TLS — nginx stays HTTP-only internally.

services:
  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/portfolio-cf.conf:/etc/nginx/conf.d/default.conf:ro

  # Expose postgres to localhost so migrations can be run from the host with npx prisma.
  # Remove this block once the schema is stable and you no longer need host access.
  db:
    ports:
      - "127.0.0.1:5432:5432"

  # Expose career-ops to localhost so the host-side dev server (npm run dev) can reach it.
  career-ops:
    ports:
      - "127.0.0.1:4200:4200"
