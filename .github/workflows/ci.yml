name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # Prisma generate does not connect to a real DB — any valid URL format works
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

      - name: Lint
        run: npm run lint

      - name: Type check (Next.js app)
        run: npx tsc --noEmit

      - name: Type check (agents)
        run: npx tsc --noEmit --project tsconfig.agents.json

      - name: Type check (mcp-server)
        run: npx tsc --noEmit --project tsconfig.mcp-server.json

      - name: Type check (career-ops-server)
        run: npm ci --prefix career-ops-server && npx tsc --noEmit --project career-ops-server/tsconfig.json

      - name: Test
        run: npm test
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          AUTH_SECRET: "ci-test-secret-not-real"
          NEXTAUTH_SECRET: "ci-test-secret-not-real"

      - name: Build
        run: npm run build
        env:
          # prisma+postgres:// satisfies the URL format check without connecting;
          # isMock() returns true so all pages use mock data — no real DB needed.
          DATABASE_URL: "prisma+postgres://ci"
          AUTH_SECRET: "ci-test-secret-not-real"
          NEXTAUTH_SECRET: "ci-test-secret-not-real"
